<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>swiftkanban</title>

    <!-- fonts from google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lexend:wght@100..900&family=Luckiest+Guy&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="flex flex-col justify-center items-center bg-amber-100 p-6">
    <main class="main-container">
      <h1 class="text-6xl py-8 text-center">SwiftKanban</h1>
      <p class="text-xl">
        SwiftKanban helps you move tasks faster, visualize progress clearly, and
        keep projects flowing smoothly. A lightweight Kanban board built for
        speed and simplicity
      </p>
      <div id="kanban-container" class="flex justify-evenly items-center">
        <div class="kanban-grid-container grid grid-cols-3 gap-8 mt-8">
          <div
            id="todo"
            class=" secondary-board flex flex-col items-center justify-between rounded-xl"
          >
            <h2
              class="text-2xl font-bold mb-4 bg-amber-50 w-full rounded-xl text-center"
            >
              To Do
            </h2>

            <ul class="kanban-column task-list w-full h-full bg-mist-200 rounded-xl transition-colors">
              <li class="task-item bg-amber-500 rounded-xl p-4 m-2 cursor-grab active:cursor-grabbing active:shadow-2xs active:scale-105 transition-all" draggable="true" id="task1">
                Task 1
              </li>
              <li class="task-item bg-amber-500 rounded-xl p-4 m-2 cursor-grab active:cursor-grabbing active:shadow-2xs active:scale-105 transition-all" draggable="true" id="task2">
                Task 2
              </li>
            </ul>
          </div>
          <div
            id="doing"
            class=" secondary-board flex flex-col items-center justify-between rounded-xl"
          >
            <h2
              class="text-2xl font-bold mb-4 bg-amber-50 w-full rounded-xl text-center"
            >
              Doing
            </h2>
            <ul class="kanban-column task-list w-full h-full bg-mist-200 rounded-xl transition-colors"></ul>
          </div>
          <div
            id="done"
            class=" secondary-board flex flex-col items-center justify-between rounded-xl"
          >
            <h2
              class="text-2xl font-bold mb-4 bg-amber-50 w-full rounded-xl text-center"
            >
              Done
            </h2>
            <ul class="kanban-column task-list w-full h-full bg-mist-200 rounded-xl transition-colors"></ul>
          </div>
        </div>
      </div>
    </main>

    <div class="toast-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
